<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt Multiple AIs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --border: 1.5px; }

    body {
      background: #111113;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: 680px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #header {
      text-align: center;
    }

    #header h1 {
      font-size: 22px;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: -0.3px;
      margin-bottom: 12px;
    }

    #bots {
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .bot-pill {
      font-size: 14px;
      font-weight: 500;
      padding: 6px 16px;
      border-radius: 999px;
      border: var(--border) solid;
      opacity: 1;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .bot-pill.off {
      color: #606060 !important;
      border-color: #383838 !important;
      background: #1e1e1e !important;
      opacity: 1;
      filter: none;
    }

    .bot-claude  { color: #f0a07a; border-color: #c0522a; background: #2a1710; }
    .bot-grok    { color: #ffffff; border-color: #888;    background: #2a2a2a; }
    .bot-perp    { color: #6ed4d0; border-color: #2d8a86; background: #0e2827; }
    .bot-chatgpt { color: #7df0aa; border-color: #22804a; background: #0e2419; }
    .bot-gemini   { color: #b8d4ff; border-color: #6090f8; background: #111d40; }
    .bot-deepseek { color: #60c8f0; border-color: #1a7aaa; background: #071e2e; }
    .bot-qwen     { color: #c084fc; border-color: #7c3aed; background: #1a0a2e; }

    textarea {
      width: 100%;
      background: #1c1c1f;
      color: #e8e8e8;
      border: var(--border) solid #2e2e33;
      border-radius: 20px;
      padding: 12px 20px 58px;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      overflow-y: hidden;
      outline: none;
      line-height: 1.6;
      transition: border-color 0.15s;
    }

    textarea::placeholder {
      color: #444;
    }

    textarea:focus {
      border-color: #3a3a42;
      background: #1e1e22;
    }

    #input-wrap {
      position: relative;
    }

    button {
      position: absolute;
      bottom: 14px;
      right: 12px;
      width: 34px;
      height: 34px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    button:hover:not(:disabled) {
      background: #1d4ed8;
    }

    button:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    button:disabled svg {
      fill: #9ca3af;
    }

    button:active {
      background: #1e40af;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="header">
      <h1>Prompt Multiple AIs</h1>
      <div id="bots">
        <span class="bot-pill bot-claude" data-key="c">Claude</span>
        <span class="bot-pill bot-grok"    data-key="g">Grok</span>
        <span class="bot-pill bot-perp"    data-key="p">Perplexity</span>
        <span class="bot-pill bot-gemini"   data-key="m">Gemini</span>
        <span class="bot-pill bot-chatgpt" data-key="o">ChatGPT</span>
        <span class="bot-pill bot-deepseek" data-key="d">DeepSeek</span>
        <span class="bot-pill bot-qwen"     data-key="q">Qwen</span>
      </div>
    </div>
    <div id="input-wrap">
      <textarea id="prompt" rows="1" placeholder="What do you want to ask?" autofocus></textarea>
      <button id="send">
        <svg width="16" height="16" viewBox="0 2 24 24" fill="white">
          <path d="M11 24V9.825L6.4 14.4L5 13L12 4L19 13L17.6 14.4L13 9.825V24H11Z"/>
        </svg>
      </button>
    </div>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
