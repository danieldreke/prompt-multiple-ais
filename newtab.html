<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Prompt Multiple AIs</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --border: 1.5px; --p1: 4px; --p2: 8px; --gap: 20px; }

    body {
      background: #111113;
      color: #e0e0e0;
      font-family: system-ui, sans-serif;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #container {
      width: max-content;
      display: flex;
      flex-direction: column;
      gap: var(--gap);
    }

    #header {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 0px;
    }

    #header h1 {
      font-size: 25px;
      font-weight: 600;
      color: #f0f0f0;
      letter-spacing: -0.3px;
    }

    #bots {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    #toggle-all {
      position: relative;
      bottom: auto;
      right: auto;
      width: auto;
      height: auto;
      background: #1e1e1e;
      border: var(--border) solid #404040;
      border-radius: 999px;
      color: #505050;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0;
      flex-shrink: 0;
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      user-select: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    #toggle-all:hover {
      background: #2a2a2e;
      color: #d0d0d0;
      border-color: #666;
    }

    #toggle-all.all-action {
      color: #e0e0e0;
      border-color: #707070;
      background: #2a2a2e;
    }

    #toggle-all::after {
      content: attr(data-tooltip);
      position: absolute;
      bottom: calc(100% + 7px);
      left: 50%;
      transform: translateX(-50%);
      background: #2a2a2e;
      color: #ccc;
      font-size: 12px;
      font-weight: 500;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid #3a3a42;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.15s;
    }

    #toggle-all:hover::after {
      opacity: 1;
    }

    .bot-pill {
      font-family: inherit;
      font-size: 14px;
      font-weight: 500;
      padding: 0;
      border-radius: 999px;
      border: var(--border) solid;
      display: flex;
      opacity: 1;
      cursor: pointer;
      user-select: none;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .pill-num {
      padding: var(--p1) calc(var(--p1) + 1px) var(--p1) calc(var(--p2) + 1px);
      border-right: var(--border) solid;
      border-right-color: inherit;
    }

    .pill-name {
      padding: var(--p1) calc(var(--p2) + 1px) var(--p1) calc(var(--p1) + 1px);
    }

    #toggle-all .pill-name {
      flex: 1;
      text-align: center;
    }

    .bot-pill.off {
      color: #606060 !important;
      border-color: #383838 !important;
      background: #1e1e1e !important;
      opacity: 1;
      filter: none;
    }

    .bot-claude  { color: #f0a07a; border-color: #c0522a; background: #2a1710; }
    .bot-grok    { color: #ffffff; border-color: #888;    background: #2a2a2a; }
    .bot-perp    { color: #6ed4d0; border-color: #2d8a86; background: #0e2827; }
    .bot-chatgpt { color: #7df0aa; border-color: #22804a; background: #0e2419; }
    .bot-gemini   { color: #b8d4ff; border-color: #6090f8; background: #111d40; }
    .bot-deepseek { color: #60c8f0; border-color: #1a7aaa; background: #071e2e; }
    .bot-qwen     { color: #c084fc; border-color: #7c3aed; background: #1a0a2e; }

    textarea {
      width: 100%;
      background: #1c1c1f;
      color: #e8e8e8;
      border: var(--border) solid #2e2e33;
      border-radius: 20px;
      padding: 12px 20px 58px;
      font-size: 16px;
      font-family: inherit;
      resize: none;
      overflow-y: hidden;
      outline: none;
      line-height: 1.6;
      transition: border-color 0.15s;
    }

    textarea::placeholder {
      color: #444;
    }

    textarea:focus {
      border-color: #3a3a42;
      background: #1e1e22;
    }

    #input-wrap {
      position: relative;
    }

    button {
      user-select: none;
    }

    #send {
      position: absolute;
      bottom: 14px;
      right: 12px;
      width: 34px;
      height: 34px;
      background: #2563eb;
      color: #fff;
      border: none;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    #send:hover:not(:disabled) {
      background: #1d4ed8;
    }

    #send:disabled {
      background: #374151;
      cursor: not-allowed;
    }

    #send:disabled svg {
      fill: #9ca3af;
    }

    #send:active {
      background: #1e40af;
    }

    #shortcuts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px 14px;
      font-size: 13px;
      color: #888;
    }

    #shortcuts span {
      display: inline-flex;
      align-items: center;
      gap: 0px;
    }

    kbd {
      font-family: inherit;
      font-size: 12px;
      background: #2a2a2e;
      border: 1px solid #4a4a52;
      border-radius: 4px;
      padding: 2px 5px;
      color: #bbb;
    }

    #header-icons {
      position: absolute;
      top: 50%;
      right: 0;
      transform: translateY(-50%);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #theme-toggle,
    #github-link {
      width: 32px;
      height: 32px;
      background: transparent;
      border: 1.5px solid #404040;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      color: #707070;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    #theme-toggle:hover,
    #github-link:hover {
      background: #2a2a2e;
      border-color: #666;
      color: #d0d0d0;
    }

    body.light {
      background: #f5f5f7;
      color: #1a1a1a;
    }

    body.light #header h1 { color: #111; }

    body.light #toggle-all {
      background: #e8e8ec;
      border-color: #c0c0c8;
      color: #888;
    }

    body.light #toggle-all:hover {
      background: #dcdce4;
      color: #333;
      border-color: #999;
    }

    body.light #toggle-all.all-action {
      color: #111;
      border-color: #666;
      background: #dcdce4;
    }

    body.light #toggle-all::after {
      background: #dcdce4;
      color: #333;
      border-color: #c0c0c8;
    }

    body.light .bot-pill.off {
      color: #999 !important;
      border-color: #d0d0d8 !important;
      background: #e8e8ec !important;
    }

    body.light .bot-claude   { color: #c04020; border-color: #e08060; background: #fff0ea; }
    body.light .bot-grok     { color: #333;    border-color: #999;    background: #f0f0f0; }
    body.light .bot-perp     { color: #1a6a68; border-color: #4aa8a4; background: #e8faf9; }
    body.light .bot-chatgpt  { color: #1a7040; border-color: #4ab878; background: #e8faf0; }
    body.light .bot-gemini   { color: #3060c8; border-color: #7098e8; background: #eef4ff; }
    body.light .bot-deepseek { color: #1a7090; border-color: #5aa8c8; background: #e4f4fc; }
    body.light .bot-qwen     { color: #6030b8; border-color: #9060d8; background: #f4eeff; }

    body.light textarea {
      background: #fff;
      color: #1a1a1a;
      border-color: #d0d0d8;
    }

    body.light textarea::placeholder { color: #aaa; }

    body.light textarea:focus {
      border-color: #a0a0b0;
      background: #f8f8fa;
    }

    body.light #shortcuts { color: #999; }

    body.light kbd {
      background: #e0e0e8;
      border-color: #b0b0bc;
      color: #555;
    }

    body.light #send:disabled {
      background: #e8e8ec;
    }

    body.light #theme-toggle,
    body.light #github-link {
      border-color: #c0c0c8;
      color: #888;
    }

    body.light #theme-toggle:hover,
    body.light #github-link:hover {
      background: #dcdce4;
      border-color: #999;
      color: #333;
    }
  </style>
</head>
<body>
  <script>if(localStorage.getItem('theme')==='light')document.body.classList.add('light');</script>
  <div id="container">
    <div id="header">
      <h1>Prompt Multiple AIs</h1>
      <div id="header-icons">
        <a id="github-link" href="https://github.com/danieldreke/prompt-multiple-ais" target="_blank" rel="noopener" tabindex="-1">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" aria-hidden="true" width="14" height="14" fill="currentColor"><path d="M12 2C6.477 2 2 6.477 2 12c0 4.418 2.865 8.166 6.839 9.489.5.092.682-.217.682-.482 0-.237-.009-.868-.013-1.703-2.782.604-3.369-1.342-3.369-1.342-.454-1.154-1.11-1.462-1.11-1.462-.908-.62.069-.608.069-.608 1.003.07 1.531 1.03 1.531 1.03.892 1.529 2.341 1.087 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.11-4.555-4.943 0-1.091.39-1.984 1.029-2.683-.103-.253-.446-1.27.098-2.647 0 0 .84-.269 2.75 1.025A9.564 9.564 0 0 1 12 6.844a9.59 9.59 0 0 1 2.504.337c1.909-1.294 2.747-1.025 2.747-1.025.546 1.377.202 2.394.1 2.647.64.699 1.028 1.592 1.028 2.683 0 3.842-2.339 4.687-4.566 4.935.359.309.678.919.678 1.852 0 1.336-.012 2.415-.012 2.741 0 .267.18.579.688.481C19.138 20.163 22 16.418 22 12c0-5.523-4.477-10-10-10z"></path></svg>
        </a>
        <button id="theme-toggle" tabindex="-1"></button>
      </div>
    </div>
    <div id="bots">
      <button id="toggle-all" tabindex="-1"><span class="pill-num">0</span><span class="pill-name"></span></button>
      <button class="bot-pill bot-claude off"   data-key="c" tabindex="-1"><span class="pill-num">1</span><span class="pill-name">Claude</span></button>
      <button class="bot-pill bot-grok off"     data-key="g" tabindex="-1"><span class="pill-num">2</span><span class="pill-name">Grok</span></button>
      <button class="bot-pill bot-perp off"     data-key="p" tabindex="-1"><span class="pill-num">3</span><span class="pill-name">Perplexity</span></button>
      <button class="bot-pill bot-gemini off"   data-key="m" tabindex="-1"><span class="pill-num">4</span><span class="pill-name">Gemini</span></button>
      <button class="bot-pill bot-chatgpt off"  data-key="o" tabindex="-1"><span class="pill-num">5</span><span class="pill-name">ChatGPT</span></button>
      <!-- <button class="bot-pill bot-deepseek off" data-key="d" tabindex="-1"><span class="pill-num">7</span><span class="pill-name">DeepSeek</span></button> -->
      <!-- <button class="bot-pill bot-qwen off"     data-key="q" tabindex="-1"><span class="pill-num">6</span><span class="pill-name">Qwen</span></button> -->
    </div>
    <div id="input-wrap">
      <textarea id="prompt" rows="1" placeholder="What do you want to ask?" autofocus></textarea>
      <button id="send">
        <svg width="16" height="16" viewBox="0 2 24 24" fill="white">
          <path d="M11 24V9.825L6.4 14.4L5 13L12 4L19 13L17.6 14.4L13 9.825V24H11Z"/>
        </svg>
      </button>
    </div>
    <div id="shortcuts">
      <span><kbd>ctrl</kbd><kbd>enter</kbd> send</span>
      <span><kbd>ctrl</kbd><kbd>shift/alt</kbd><kbd>0</kbd> toggle all</span>
      <span><kbd>ctrl</kbd><kbd>alt</kbd><kbd>1–7</kbd> activate first <i>n</i></span>
      <span><kbd>ctrl</kbd><kbd>shift</kbd><kbd>1–7</kbd> toggle <i>n</i>th</span>
    </div>
  </div>
  <script src="newtab.js"></script>
</body>
</html>
